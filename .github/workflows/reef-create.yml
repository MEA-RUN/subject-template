name: Create Reef site

on:
  workflow_dispatch:
    inputs:
      site_repository:
        description: Generated repository name (defaults to <subject>-site)
        required: false
        type: string

permissions:
  contents: read

jobs:
  create:
    uses: MEA-RUN/actions/.github/workflows/reef-create.yml@main
    with:
      site_repository: ${{ inputs.site_repository }}
    secrets: inherit
